[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-scrobbler"
version = "0.5.0"
description = "Scrobble CD playback to ListenBrainz and Last.fm with mpv"
readme = "README.md"
license = "MIT"
authors = [
    { name = "noahs", email = "recent8571@proton.me" },
]
requires-python = ">=3.12"
dependencies = [
    "musicbrainzngs",
    "discid",
    "requests",
    "pylast",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://codeberg.org/lingawakad/cd-scrobbler"

[project.scripts]
cdscrobble = "cdscrobble:main"

[tool.setuptools]
py-modules = ["cdscrobble", "mbid", "musicbrainz", "listenbrainz", "lastfm", "config", "mpv_ipc", "offline_queue"]
